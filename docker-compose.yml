services:
  crashdigest:
    # Собирать локально — или закомментировать и взять готовый образ:
    #   image: magw4y/tg-crashlytics-reporter:latest
    build: .
    image: crashdigest:local
    container_name: crashdigest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      # Ключ сервисного аккаунта: ./secrets/google-service-account.json.
      # Монтируется каталог, а не файл: при отсутствии файла Docker молча
      # создал бы на его месте пустую директорию.
      - ./secrets:/secrets:ro
    networks:
      - vpn-proxy_default

networks:
  vpn-proxy_default:
    external: true
