# Тестовое окружение: тот же образ, другой канал, ДРУГАЯ база состояния.
#
#   docker compose -f docker-compose.test.yml up -d --build
#
# Отдельный том состояния — главный барьер между окружениями. С общей базой
# отладочный прогон записал бы issue как «уже виденные», и прод навсегда
# перестал бы считать их новыми.
services:
  crashdigest-test:
    build: .
    image: crashdigest:local
    container_name: crashdigest-test
    # На время отладки контейнер не поднимается сам: перезапуск по кругу
    # из-за кривой настройки засыпал бы тестовый канал сообщениями об отказе.
    restart: "no"
    env_file: .env.test
    # Значения литералами, без ${}: подстановка в compose читает .env рядом с
    # файлом (то есть ПРОДОВЫЙ), а не env_file выше. Через ${} тестовый
    # контейнер молча взял бы прод-настройки.
    environment:
      # LLM_BASE_URL и LLM_API_KEY здесь НЕ перечислены намеренно: они
      # приезжают через env_file. Подстановка ${...} читает .env рядом с
      # этим файлом, а НЕ env_file выше, и в сервисе с другим env-файлом
      # пустая подстановка молча перебила бы заданный адрес (environment
      # приоритетнее env_file) и так же молча выключила бы разбор.
      LLM_MODEL: gemini-claude-opus-4-6-thinking
      LLM_TIMEOUT: 120
      ANALYZE_TOP: 5
      CRASH_CONTEXT: breadcrumbs,custom_keys,user
    volumes:
      - ./data-test:/data
      - ./secrets:/secrets:ro
    # Сети прокси здесь нет намеренно: прод на этом же хосте ходит в Telegram
    # напрямую (в его compose блок networks закомментирован), а шлюз моделей —
    # сосед по локальной сети. Подключение к vpn-proxy_default меняло бы
    # маршрутизацию тестового контейнера по сравнению с боевым, то есть
    # отладка проверяла бы не то, что потом поедет в прод.
    # networks:
    #   - vpn-proxy_default
